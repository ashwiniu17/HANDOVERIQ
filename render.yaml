# Render "Blueprint" for the backend (an API server written with FastAPI).
# Use it with: Render dashboard -> New -> Blueprint, or copy the settings by hand.
# Values marked "sync: false" are asked for when you create the service.
# The database is NOT created here: use any PostgreSQL (for example Neon) and
# paste its connection string as DATABASE_URL.
services:
  - type: web
    name: handoveriq-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run automatically at startup (AUTO_MIGRATE). Keep ONE instance.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      # Website and API are on different sites (netlify.app vs onrender.com).
      # With a custom domain for both, use COOKIE_SAMESITE=lax instead.
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
