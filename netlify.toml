# Netlify settings for the website (the frontend folder).
# Before the first deploy, set NEXT_PUBLIC_API_BASE_URL in Netlify:
#   Site configuration -> Environment variables
# The build stops with a clear message if it is missing.

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
